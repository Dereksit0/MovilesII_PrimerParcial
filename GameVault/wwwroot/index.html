<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GameVault</title>
    <base href="/" />
    <link rel="stylesheet" href="css/fiori.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="arranque">Cargando GameVault...</div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Algo se rompio en la app.
        <a href="" class="reload">Recargar</a>
        <button type="button" class="dismiss" aria-label="Cerrar este aviso">x</button>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // Recargar y cerrar la barra de error.
        document.querySelector("#blazor-error-ui .reload").addEventListener("click", function (e) {
            e.preventDefault();
            location.reload();
        });
        document.querySelector("#blazor-error-ui .dismiss").addEventListener("click", function () {
            document.getElementById("blazor-error-ui").style.display = "none";
        });
    </script>
</body>

</html>
